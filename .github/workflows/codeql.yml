name: "CodeQL"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 6 * * 1'

# pdl-test-cluster runs the actions-runner image, which does not offer the Node version several
# actions request by default; without this they fail before their first step runs.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: Analyze
    runs-on: [pdl-test-cluster]
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.

    # The self-hosted runner image ships no .NET SDK, which the C# build below needs.
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      # The runner user cannot write /usr/share/dotnet, so install the SDK somewhere it can.
      env:
        DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
      with:
        dotnet-version: 10.0.x

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}

    # An explicit build rather than autobuild, which cannot find a build method for the .slnx
    # solution on the self-hosted runner ("Could not auto-detect a suitable build method").
    - name: Build
      run: dotnet build --configuration Release

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{ matrix.language }}"